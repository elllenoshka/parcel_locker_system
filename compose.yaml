services:
  postgres:
    image: postgres:17.11
    container_name: parcel-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 5s
      retries: 30

  postgres-dpc:
    image: postgres:17-alpine
    container_name: dpc-postgres
    environment:
      POSTGRES_USER: dpc
      POSTGRES_PASSWORD: dpc_local
      POSTGRES_DB: dpc
    ports:
      - "5433:5432"
    volumes:
      - dpc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpc -d dpc"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  dpc_pgdata: