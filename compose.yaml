services:
  postgres:
    image: postgres:17-alpine
    container_name: dpc-postgres
    environment:
      POSTGRES_DB: dpc
      POSTGRES_USER: dpc
      POSTGRES_PASSWORD: dpc_local
    ports:
      - "5433:5432"
    volumes:
      - dpc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpc -d dpc"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dpc_pgdata: