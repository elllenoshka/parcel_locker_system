services:
  postgres:
    image: postgres:17.11
    container_name: parcel-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parcel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local}
      POSTGRES_DB: ${POSTGRES_DB:-parcel_lockers}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
