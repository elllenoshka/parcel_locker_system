spring.application.name=dpc
server.port=8000

spring.datasource.url=jdbc:postgresql://localhost:5433/dpc
spring.datasource.username=dpc
spring.datasource.password=dpc_local

app.api-token=${API_TOKEN:dev-token}

app.queue-capacity=${QUEUE_CAPACITY:50}
app.workers=${WORKERS:4}
app.slow-call-min-ms=200
app.slow-call-max-ms=600